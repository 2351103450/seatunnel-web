name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: seatunnel-web-ui
        run: npm install
      - name: Build frontend
        working-directory: seatunnel-web-ui
        run: npm run build
      - name: Build backend distribution
        run: ./mvnw -T 1C clean package -DskipTests
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seatunnel-web-release
          path: |
            seatunnel-web-dist/target/*
            seatunnel-web-ui/dist/**
          if-no-files-found: warn
