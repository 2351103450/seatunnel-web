name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Show Maven version
        run: ./mvnw --version

      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress -T 1C clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: seatunnel-web-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Show Node.js version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build