services:
  seatunnel-web-api:
    image: ${SEATUNNEL_WEB_API_IMAGE:-seatunnel-web-api:latest}

    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime

    container_name: seatunnel-web-api
    restart: unless-stopped

    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      APP_OPTS: ${APP_OPTS:-}

      SERVER_PORT: 9527
      SPRING_PROFILES_ACTIVE: mysql

      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-seatunnel_web}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

    expose:
      - "9527"

    volumes:
      - seatunnel-web-logs:/opt/seatunnel-web/logs
      - seatunnel-web-jdbc-drivers:/opt/seatunnel-web/jdbc-drivers

    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9527"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  seatunnel-web:
    image: ${SEATUNNEL_WEB_IMAGE:-seatunnel-web:latest}

    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime

    container_name: seatunnel-web
    restart: unless-stopped

    depends_on:
      seatunnel-web-api:
        condition: service_healthy

    ports:
      - "${SEATUNNEL_WEB_PORT:-9001}:80"

volumes:
  seatunnel-web-logs:
  seatunnel-web-jdbc-drivers: